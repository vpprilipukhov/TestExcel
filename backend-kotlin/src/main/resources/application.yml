server:
  port: 3000

spring:
  datasource:
    url: jdbc:h2:file:./data
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.H2Dialect
  show-sql: true
  pretty-sql: true
  database-validation:
    mode: CREATE
